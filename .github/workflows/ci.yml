name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # TODO: pin actions to full commit SHAs (Dependabot will keep them updated)
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"
