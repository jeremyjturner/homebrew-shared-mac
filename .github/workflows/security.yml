name: Security
# Scans that run before a change reaches main. They need no secrets and no paid plan.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 2" # Tuesdays 05:41 UTC: catches new rules and new advisories
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflows:
    # zizmor reads the workflow files for unsafe patterns (script injection,
    # unpinned actions, too many permissions).
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: 1.33.1
  secrets:
    # gitleaks looks for passwords, keys and tokens in the whole git history.
    # The binary is pinned by version and SHA-256 (the gitleaks-action wrapper has a commercial licence).
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
